# Portainer-friendly compose
# Portainer: только pull образа с GitHub Actions (GHCR)

services:
  beget-mail:
    image: ghcr.io/sereza111/webcontol_mail:latest
    pull_policy: always
    container_name: beget-mail
    restart: unless-stopped

    dns:
      - 1.1.1.1
      - 8.8.8.8

    # ←←← ИСПРАВИЛИ ЗДЕСЬ
    ports:
      - "127.0.0.1:3002:3000"          # Доступ только через локальный reverse proxy

    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BEGET_LOGIN: ${BEGET_LOGIN}
      BEGET_PASSWORD: ${BEGET_PASSWORD}
      SQLITE_PATH: /data/mailboxes.db

    volumes:
      - beget-mail-data:/data

volumes:
  beget-mail-data:
